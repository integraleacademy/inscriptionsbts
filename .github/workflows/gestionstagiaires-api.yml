name: Connexion Gestion Stagiaires
on:
  pull_request:
    paths: ['gestionstagiaires_api.py', 'test_gestionstagiaires_api.py', 'app.py', '.github/workflows/gestionstagiaires-api.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.1
      - run: python -m unittest test_gestionstagiaires_api -v
