name: Trainer invoice checks
on:
  pull_request:
    paths:
      - 'trainer_invoice*.py'
      - 'trainer_admin_planning.py'
      - 'trainer_access.py'
      - 'trainer_availability.py'
      - 'planning_pdf.py'
      - 'campus_admin.py'
      - 'planning.py'
      - 'teaching.py'
      - 'templates/*trainer*'
      - 'static/js/trainer-invoices.js'
      - 'static/js/trainer-timetable.js'
      - 'static/js/trainer-admin-planning.js'
      - 'static/js/trainer-availability.js'
      - 'static/js/trainer-calendar-courses.js'
      - 'static/js/global-search.js'
      - 'static/css/trainer-invoices.css'
      - 'tests/test_trainer_invoice*.py'
      - 'tests/test_trainer_workspace_updates.py'
      - 'tests/test_trainer_availability*.py'
      - 'tests/test_planning_pdf.py'
      - 'tests/trainer_admin_planning_frontend.cjs'
      - 'tests/trainer_availability_frontend.cjs'
      - '.github/workflows/trainer-invoices.yml'
permissions:
  contents: read
jobs:
  trainer-invoices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest beautifulsoup4
      - run: python -m pytest -q tests/test_trainer_invoice_audit.py tests/test_trainer_invoice_routes.py tests/test_trainer_workload.py tests/test_trainer_tabs_annual.py tests/test_trainer_access.py tests/test_trainer_admin_planning_audit.py tests/test_trainer_workspace_updates.py tests/test_trainer_availability.py tests/test_trainer_availability_ui.py tests/test_planning_pdf.py
        env:
          TRAINER_NOTIFICATION_WORKER_DISABLED: '1'
          TEACHING_REMINDER_WORKER_DISABLED: '1'
      - run: node --check static/js/trainer-invoices.js
      - run: node --check static/js/trainer-timetable.js && node --check static/js/global-search.js
      - run: node --check static/js/trainer-admin-planning.js && node --check static/js/trainer-availability.js && node --check static/js/trainer-calendar-courses.js
      - run: npm install --prefix /tmp/trainer-calendar-checks --no-audit --no-fund jsdom@26
      - run: node tests/trainer_admin_planning_frontend.cjs && node tests/trainer_availability_frontend.cjs
        env:
          NODE_PATH: /tmp/trainer-calendar-checks/node_modules
