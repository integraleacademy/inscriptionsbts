<label>Motif de l’absence<select name="reason" required data-absence-reason><option value="">Choisir un motif</option>{% for group,items in reasons.values()|groupby('group') %}<optgroup label="{{ group }}">{% for reason in items %}<option value="{{ reason.key }}" data-evidence="{{ reason.evidence }}"{% if request.form.get('reason',submission.reason if submission else '')==reason.key %} selected{% endif %}>{{ reason.label }}</option>{% endfor %}</optgroup>{% endfor %}</select></label>
<p class="sw-evidence-hint" data-evidence-hint aria-live="polite">Choisis un motif pour connaître le justificatif attendu.</p>
<label>Précisions pour l’équipe<textarea name="message" maxlength="3000" rows="4" placeholder="Précise uniquement les éléments utiles au traitement de ton absence.">{{ request.form.get('message',submission.message if submission else '') }}</textarea><small>Obligatoire pour « Autre situation ». Aucun diagnostic médical n’est demandé.</small></label>
{% if files|length < 5 %}<label>{{ 'Ajouter des documents' if files else 'Joindre un justificatif' }}<input type="file" name="documents" accept=".pdf,.jpg,.jpeg,.png,.webp" multiple{% if not files %} required{% endif %}><small>PDF, JPEG, PNG ou WebP. 10 Mo par fichier, 5 documents et 20 Mo au total.</small></label>{% else %}<p class="sw-muted">Les 5 emplacements sont utilisés. Tu peux compléter ton message ou contacter l’équipe pour un autre document.</p>{% endif %}
