<section id="panel-cyclades" role="tabpanel" aria-labelledby="tab-cyclades" class="sheet-panel cy-panel" hidden
         data-search-url="{{ url_for('cyclades_candidate_search', cid=row.id) }}">
  <div class="cy-card">
    <header class="cy-header">
      <div>
        <p class="cy-kicker">{{ icon('file') }} CYCLADES</p>
        <h2>Inscription à l’examen</h2>
      </div>
      <form class="cy-search" method="post" action="{{ url_for('cyclades_candidate_search', cid=row.id) }}"{% if not cyclades.can_search %} hidden{% endif %}>
        <input type="hidden" name="csrf_token" value="{{ planning_csrf_token }}">
        <input type="hidden" name="return_to" value="{{ request.args.get('return_to', '') }}">
        <button type="submit" class="cy-button" aria-label="Rechercher sur CYCLADES"{% if cyclades.busy %} disabled{% endif %}>{{ icon('search') }} {{ 'Actualiser' if cyclades.matches else 'Rechercher' }}</button>
      </form>
    </header>
    <div class="cy-result" aria-live="polite">{% include '_cyclades_result.html' %}</div>
    <p class="cy-request-error" role="alert" hidden></p>
  </div>
  <script src="{{ url_for('static', filename='js/cyclades.js') }}" defer></script>
</section>
