<section class="campus-stats enrollment-stats" aria-label="Indicateurs de la sélection">
  <article><span>Étudiants inscrits</span><strong data-kpi="total">{{ stats.total }}</strong></article>
  <article class="enrollment-stat-with"><span>Avec contrat d’apprentissage</span><strong data-kpi="with_contract">{{ stats.with_contract }}</strong></article>
  <article class="enrollment-stat-without"><span>Sans contrat identifié</span><strong data-kpi="without_contract">{{ stats.without_contract }}</strong></article>
  <article class="enrollment-stat-check"><span>Contrat à vérifier</span><strong data-kpi="unverified">{{ stats.unverified }}</strong></article>
  <article><span>Sans promotion</span><strong data-kpi="unassigned">{{ stats.unassigned }}</strong></article>
  <article><span>En distanciel</span><strong data-kpi="remote">{{ stats.remote }}</strong></article>
</section>
